model_name_or_path: /root/autodl-tmp/qwen-4b-rams-sft-merged
stage: ppo

# 数据集设置
finetuning_type: lora
dataset: rams_rl
dataset_dir: data/processed
template: qwen

# 生成参数（PPO rollout）
do_sample: false
temperature: 0.2
top_p: 0.9
top_k: 20
repetition_penalty: 1.05
max_new_tokens: 256

do_train: true
output_dir: /root/autodl-tmp/qwen-4b-rams-sft-merged/qwen-4b-rams-rl
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 1
learning_rate: 1.0e-6
ppo_epochs: 4
ppo_target: 0.1
ppo_whiten_rewards: false
bf16: false
logging_steps: 10
save_steps: 200
overwrite_output_dir: true

# ECPO 奖励回调：listwise ranking + certificate validity + evidence-cycle
reward_model_type: callback
reward_callback: ecpo
reward_callback_args:
  reward_ckpt: /root/autodl-tmp/qwen-4b-rams-rm/reward.ckpt
  trajectory_path: data/processed/rams_traj.jsonl
  k: 10
  gamma: 0.95
  lambda_cert: 1.0
  lambda_cycle: 1.0
  invalid_penalty: 1.0
  missing_penalty: 0.25
  support_threshold: 0.35
  support_margin: 0.05
  reward_clip:
    - -5.0
    - 5.0

# wandb 设置（可改为 none 禁用）
report_to: wandb
run_name: rams_ecpo
wandb_project: rams-ecpo
wandb_tags: ecpo,qwen3-4b,rams
