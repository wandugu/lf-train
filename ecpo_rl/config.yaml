defaults:
  k: 10
  alpha: 0.6
  output_dir: outputs/qwen-4b-rl
  reward_ckpt: outputs/qwen-4b-rm/reward.ckpt
  policy_logprobs: outputs/qwen-4b-rl/policy_logprobs.json
  traj_path: data/processed/traj.jsonl
  auto_sample: true
  sample_dir: outputs/samples
  sample_traj_path: outputs/samples/traj.jsonl
  sample_reward_ckpt: outputs/samples/reward.ckpt
  sample_policy_logprobs: outputs/samples/policy_logprobs.json

defaults_by_mode:
  maven:
    output_dir: outputs/qwen-4b-rl
    reward_ckpt: outputs/qwen-4b-rm/reward.ckpt
    policy_logprobs: outputs/qwen-4b-rl/policy_logprobs.json
    traj_path: data/processed/traj.jsonl
    sample_traj_path: outputs/samples/traj.jsonl
    sample_reward_ckpt: outputs/samples/reward.ckpt
    sample_policy_logprobs: outputs/samples/policy_logprobs.json
  rams:
    output_dir: outputs/qwen-4b-rams-rl
    reward_ckpt: outputs/qwen-4b-rams-rm/reward.ckpt
    policy_logprobs: outputs/qwen-4b-rams-rl/policy_logprobs.json
    traj_path: data/processed/rams_traj.jsonl
    sample_traj_path: outputs/samples/rams_traj.jsonl
    sample_reward_ckpt: outputs/samples/rams_reward.ckpt
    sample_policy_logprobs: outputs/samples/rams_policy_logprobs.json

data:
  mode: maven
  modes:
    maven:
      label: MAVEN-ERE
      raw_dir: data/maven_raw
      processed_dir: data/processed
      processed_files:
        event: event.jsonl
        traj: traj.jsonl
        pairs: pairs.jsonl
        sft: maven_sft.jsonl
        rl_prompts: rl_prompts.jsonl
      dataset_info:
        sft: maven_sft
        rl: maven_rl
      train:
        pretrain_config: configs/pretrain_maven.yaml
        export_config: configs/export_qwen_maven_sft.yaml
        ppo_config: configs/ppo_rl.yaml
        reward_output_dir: /root/autodl-tmp/qwen-4b-maven-rm
        reward_ckpt: /root/autodl-tmp/qwen-4b-maven-rm/reward.ckpt
        policy_output_dir: /root/autodl-tmp/qwen-4b-rl
      wandb:
        project: maven-ecpo
        sft_tags: sft,qwen3-4b,maven
        ppo_tags: ecpo,qwen3-4b,maven
    rams:
      label: RAMS
      raw_dir: data/rams_raw
      processed_dir: data/processed
      processed_files:
        event: rams_event.jsonl
        traj: rams_traj.jsonl
        pairs: rams_pairs.jsonl
        sft: rams_sft.jsonl
        rl_prompts: rams_rl_prompts.jsonl
      dataset_info:
        sft: rams_sft
        rl: rams_rl
      train:
        pretrain_config: configs/pretrain_rams.yaml
        export_config: configs/export_qwen_rams_sft.yaml
        ppo_config: configs/ppo_rl_rams.yaml
        reward_output_dir: /root/autodl-tmp/qwen-4b-rams-rm
        reward_ckpt: /root/autodl-tmp/qwen-4b-rams-rm/reward.ckpt
        policy_output_dir: /root/autodl-tmp/qwen-4b-rams-rl
      wandb:
        project: rams-ecpo
        sft_tags: sft,qwen3-4b,rams
        ppo_tags: ecpo,qwen3-4b,rams

datasets:
  MAVEN-ERE:
    traj_path: data/processed/traj.jsonl
  RAMS:
    traj_path: data/processed/rams_traj.jsonl

profiles:
  base: {}

run:
  datasets: MAVEN-ERE
  profiles: base
  k: 10
  alpha: 0.6
  auto_sample: true

stats:
  dataset_dir: data/processed
  output_path: outputs/dataset_stats.json
  dataset_file_keys:
    - traj
    - rl_prompts
    - sft
    - event
    - pairs
  auto_sample: true
  max_examples: 2
  sample_dir: outputs/samples
  emit_schemas: true
  schema_output_dir: outputs/schemas
  schema_file_map:
    traj: traj.schema.json
    rl_prompts: rl_prompts.schema.json
    sft: sft.schema.json
    event: event.schema.json
    pairs: pairs.schema.json
  stage_mapping:
    enabled: true
    mapping_file: mapping/event2skeleton.json
    stage_order:
      - PREP
      - PROBE
      - EXECUTE
      - OUTCOME
    datasets:
      - mode: maven
        label: MAVEN-ERE
      - mode: rams
        label: RAMS
    fallback:
      default_stage: PREP
      keywords:
        prep:
          - plan
          - prepare
          - gather
          - meet
          - statement
          - warn
          - warning
          - know
          - intel
          - intelligence
          - discuss
          - train
          - process_start
          - mobilize
          - mobilise
        probe:
          - probe
          - observe
          - monitor
          - investigate
          - analyse
          - analyze
          - assess
          - inspect
          - review
          - survey
          - recon
          - scout
          - interrogate
          - warning
          - statement
          - process_start
          - negotiat
        execute:
          - attack
          - hostile
          - strike
          - bomb
          - assault
          - conduct
          - perform
          - raiding
          - raid
          - shoot
          - shell
          - fire
          - engage
          - execute
          - ambush
          - threaten
          - hijack
          - disrupt
          - extort
          - seize
          - abduct
          - capture
          - arrest
          - detain
          - invade
          - deploy
          - organize
          - fight
          - cyber
          - infiltrate
        outcome:
          - release
          - free
          - withdraw
          - return
          - surrender
          - cease
          - ceasefire
          - cease_fire
          - negotiate
          - settle
          - resolve
          - conclude
          - resign
          - acquit
          - discharge
          - pardoned
          - paroled
          - death
          - die
          - killed
          - injury
          - hurt
          - injured
